name: release

# Tag-driven. `git push --tags` on a v* tag builds the matrix, verifies
# the aarch64 archives natively, signs everything and publishes.
#
# workflow_dispatch runs the same build so a release can be rehearsed, but
# the publish job is gated on the ref actually being a tag — a dispatch on
# a branch produces artifacts and stops there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.14.0

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Verify source with upstream's own test suite
        run: |
          set -eu
          for mode in opt ref; do
            work=$(mktemp -d)
            cp -R upstream/argon2/. "$work/"
            cd "$work"
            echo "::group::upstream test suite ($mode path)"
            if [ "$mode" = opt ]; then
              make test CC="zig cc -target x86_64-linux-gnu" OPTTARGET=x86_64
            else
              make test CC="zig cc -target x86_64-linux-gnu" OPTTEST=1
            fi
            echo "::endgroup::"
            cd - >/dev/null
            rm -rf "$work"
          done

      - name: Build, smoke and package every target
        run: sh .github/run-matrix.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: argon2-dist
          path: dist/*
          if-no-files-found: error

  verify-arm64:
    name: Verify aarch64 binaries natively
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: argon2-dist
          path: dist

      - name: Run the shipped aarch64 binaries
        run: |
          set -eu
          for target in linux-arm64-musl linux-arm64-gnu; do
            tar -xJf "dist/argon2-$target.tar.xz" -C /tmp
            SMOKE_NATIVE=1 \
            BIN_DIR="/tmp/argon2-$target/bin" \
            TARGET="$target" \
              sh scripts/smoke.sh
          done

  publish:
    name: Publish GitHub Release
    # Only a tag publishes. A dispatch on a branch stops after build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: argon2-dist
          path: dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          find . -type f \( -name '*.tar.xz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's|  \./|  |' > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archives and SHA256SUMS
        # SHA256SUMS proves the archives match each other; the sigstore
        # bundle proves SHA256SUMS came from this workflow.
        run: |
          set -eu
          for f in dist/*.tar.xz dist/*.zip dist/SHA256SUMS; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle="$f.sigstore.json" "$f"
          done

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.xz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
            dist/*.sigstore.json
